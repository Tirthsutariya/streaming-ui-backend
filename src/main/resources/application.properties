spring.application.name=video-streaming-backend

# ==========================
# Database Configuration
# ==========================
spring.datasource.url=jdbc:postgresql://localhost:5432/video
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================
# Server
# ==========================
server.port=8083

# ==========================
# Swagger
# ==========================
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================
# Multipart Upload Limits
# ==========================
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# ==========================
# Cloudflare R2
# ==========================
cloudflare.r2.account-id = e398d708a34dc1d191a54ef0a37eb30e
cloudflare.r2.access-key=befa55a28ed9e53eaa9d50dc1c80ff1b
cloudflare.r2.secret-key=e87ee25e0dd104dcae83f8a9db06c250cea187d1758781e8b6d8d5737c126e25
cloudflare.r2.bucket-name=streamverse-videos

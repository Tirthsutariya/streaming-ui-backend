spring.application.name=video-streaming-backend

# ==========================
# Database Configuration
# ==========================
spring.datasource.url=jdbc:postgresql://localhost:5432/video
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================
# Server
# ==========================
server.port=8083

# ==========================
# Swagger
# ==========================
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================
# Multipart Upload Limits
# ==========================
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# ==========================
# Cloudflare R2
# ==========================
cloudflare.r2.account-id = ${CLOUDFLARE_R2_ACCOUNT_ID}
cloudflare.r2.access-key= ${CLOUDFLARE_R2_ACCESS_KEY}
cloudflare.r2.secret-key= ${CLOUDFLARE_R2_SECRET_KEY}
cloudflare.r2.bucket-name= ${CLOUDFLARE_R2_BUCKET_NAME}
# Public read URL for the bucket (R2 public dev URL or your custom domain).
# Required — the saved video/thumbnail links are built from this + object key.
cloudflare.r2.public-base-url=${R2_PUBLIC_BASE_URL:}

# ==========================
# FFmpeg / HLS Transcoding
# ==========================
# ffmpeg & ffprobe must be installed and on PATH (or set absolute paths).
ffmpeg.path=${FFMPEG_PATH:ffmpeg}
ffmpeg.probe-path=${FFPROBE_PATH:ffprobe}
ffmpeg.hls-time-seconds=6
# Local scratch dir for downloads + HLS output (cleaned up after each job).
ffmpeg.work-dir=${TRANSCODE_WORK_DIR:${java.io.tmpdir}/streamverse-transcode}

